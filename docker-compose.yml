name: incident-ops

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
      SQL_WAIT_INTERVAL: "15"
    volumes:
      - ./local/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    image: ghcr.io/marcelo-roman/incident-ops-api:${IMAGE_TAG:-latest}
    build:
      context: ./services/api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__IncidentOps: Server=sqlserver,1433;Database=IncidentOps;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__TopicName: incident-events
      Security__EscalationApiKey: ${INCIDENT_OPS_API_KEY:?set INCIDENT_OPS_API_KEY in .env}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in .env}
      Auth__DemoUsername: ${DEMO_USERNAME:-demo}
      Auth__DemoPassword: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
      Chaos__Enabled: "true"
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-8080}
      Sla__TimeScale: ${SLA_TIME_SCALE:-1}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      OTEL_SERVICE_NAME: incident-ops-api
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      servicebus:
        condition: service_started

  insights:
    image: ghcr.io/marcelo-roman/incident-ops-insights:${IMAGE_TAG:-latest}
    build:
      context: ./services/insights
    environment:
      INCIDENTS_API_BASE_URL: http://api:8080
      INCIDENTS_API_KEY: ${INCIDENT_OPS_API_KEY:?set INCIDENT_OPS_API_KEY in .env}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
      OTEL_SERVICE_NAME: incident-ops-insights
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "${INSIGHTS_PORT:-8000}:8000"
    depends_on:
      - api

  web:
    image: ghcr.io/marcelo-roman/incident-ops-web:${IMAGE_TAG:-latest}
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://localhost:${API_PORT:-5080}
      INSIGHTS_BASE_URL: http://localhost:${INSIGHTS_PORT:-8000}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
      - insights

  prometheus:
    image: prom/prometheus:v3.15.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$INCIDENT_OPS_API_KEY" > /prometheus/api-key &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.retention.time=15d
        --web.enable-lifecycle
    environment:
      INCIDENT_OPS_API_KEY: ${INCIDENT_OPS_API_KEY:?set INCIDENT_OPS_API_KEY in .env}
    volumes:
      - ./local/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$INCIDENT_OPS_API_KEY" > /alertmanager/api-key &&
        exec /bin/alertmanager
        --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager
    environment:
      INCIDENT_OPS_API_KEY: ${INCIDENT_OPS_API_KEY:?set INCIDENT_OPS_API_KEY in .env}
    volumes:
      - ./local/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    profiles: [functions]
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  notification-sink:
    image: mendhak/http-https-echo:latest
    ports:
      - "8099:8080"

volumes:
  sqldata:
  promdata:
