name: deploy-container-app

on:
  workflow_call:
    inputs:
      container-app-name:
        description: Container app to update.
        type: string
        required: true
      resource-group:
        description: Resource group of the container app.
        type: string
        required: true
      image:
        description: Fully qualified image reference, preferably pinned by digest or commit tag.
        type: string
        required: true
      health-url:
        description: URL that must answer 2xx once the new revision serves traffic.
        type: string
        required: true
      requires-environment-on:
        description: Skips the readiness wait and the smoke test when the environment is powered off, because the app then depends on resources that do not exist.
        type: boolean
        default: false
      attempts:
        description: Health and readiness polling attempts.
        type: number
        default: 20
      interval-seconds:
        description: Seconds between polling attempts.
        type: number
        default: 15
    outputs:
      revision:
        description: Revision serving traffic after the job.
        value: ${{ jobs.deploy.outputs.revision }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.container-app-name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.container-app-name }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.rollback.outcome == 'success' && steps.rollback.outputs.revision || steps.update.outputs.revision }}
    env:
      APP_NAME: ${{ inputs.container-app-name }}
      RESOURCE_GROUP: ${{ inputs.resource-group }}
      IMAGE: ${{ inputs.image }}
      HEALTH_URL: ${{ inputs.health-url }}
      ATTEMPTS: ${{ inputs.attempts }}
      INTERVAL_SECONDS: ${{ inputs.interval-seconds }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure CLI
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Environment state
        id: state
        env:
          REQUIRES_ON: ${{ inputs.requires-environment-on }}
        run: |
          namespaces=$(az resource list --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.ServiceBus/namespaces --query "length(@)" --output tsv)
          verify="true"
          if [[ "$REQUIRES_ON" == "true" && "$namespaces" == "0" ]]; then
            verify="false"
            echo "::notice::the environment is powered off; ${APP_NAME} gets the new image and the next power up verifies it"
          fi
          echo "verify=${verify}" >> "$GITHUB_OUTPUT"

      - name: Capture current revision
        id: current
        run: |
          revision=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestReadyRevisionName --output tsv)
          image=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.template.containers[0].image" --output tsv)
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Update image
        id: update
        run: |
          suffix="gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "$suffix" \
            --output none
          echo "revision=${APP_NAME}--${suffix}" >> "$GITHUB_OUTPUT"

      - name: Wait for revision readiness
        id: readiness
        if: steps.state.outputs.verify == 'true'
        env:
          REVISION: ${{ steps.update.outputs.revision }}
        run: |
          for attempt in $(seq 1 "$ATTEMPTS"); do
            ready=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestReadyRevisionName --output tsv)
            if [[ "$ready" == "$REVISION" ]]; then
              echo "revision ${REVISION} is ready"
              exit 0
            fi
            state=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$REVISION" --query properties.provisioningState --output tsv)
            if [[ "$state" == "Failed" ]]; then
              echo "::error::revision ${REVISION} failed to provision"
              exit 1
            fi
            echo "attempt ${attempt}/${ATTEMPTS}: ready=${ready} provisioning=${state}"
            sleep "$INTERVAL_SECONDS"
          done
          echo "::error::revision ${REVISION} did not become ready"
          exit 1

      - name: Smoke test
        id: smoke
        if: steps.state.outputs.verify == 'true'
        run: |
          for attempt in $(seq 1 "$ATTEMPTS"); do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 20 "$HEALTH_URL" || echo "000")
            if [[ "$status" =~ ^2 ]]; then
              echo "health check passed with ${status}"
              exit 0
            fi
            echo "attempt ${attempt}/${ATTEMPTS}: ${HEALTH_URL} answered ${status}"
            sleep "$INTERVAL_SECONDS"
          done
          echo "::error::${HEALTH_URL} did not answer 2xx"
          exit 1

      - name: Roll back to previous revision
        id: rollback
        if: failure() && steps.current.outputs.revision != ''
        env:
          PREVIOUS_REVISION: ${{ steps.current.outputs.revision }}
        run: |
          suffix="rb${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az containerapp revision copy \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --from-revision "$PREVIOUS_REVISION" \
            --revision-suffix "$suffix" \
            --output none
          echo "revision=${APP_NAME}--${suffix}" >> "$GITHUB_OUTPUT"
          echo "::warning::rolled back ${APP_NAME} to the template of ${PREVIOUS_REVISION}"

      - name: Job summary
        if: always()
        env:
          PREVIOUS_REVISION: ${{ steps.current.outputs.revision }}
          PREVIOUS_IMAGE: ${{ steps.current.outputs.image }}
          NEW_REVISION: ${{ steps.update.outputs.revision }}
          UPDATE: ${{ steps.update.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          ROLLBACK_REVISION: ${{ steps.rollback.outputs.revision }}
        run: |
          {
            echo "## ${APP_NAME}"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Previous revision | \`${PREVIOUS_REVISION:-none}\` (\`${PREVIOUS_IMAGE:-none}\`) |"
            echo "| New revision | \`${NEW_REVISION:-not created}\` |"
            echo "| Update | ${UPDATE:-skipped} |"
            echo "| Readiness | ${READINESS:-skipped} |"
            echo "| Smoke test | ${SMOKE:-skipped} |"
            echo "| Rollback | ${ROLLBACK:-skipped} ${ROLLBACK_REVISION:+(\`${ROLLBACK_REVISION}\`)} |"
            echo "| Health URL | ${HEALTH_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
