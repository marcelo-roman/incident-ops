name: functions

on:
  pull_request:
    paths:
      - services/functions/**
      - contracts/**
      - .github/workflows/functions.yml
  push:
    branches: [main]
    paths:
      - services/functions/**
      - .github/workflows/functions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/functions

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FUNCTION_APP_NAME: func-incident-ops
  PACKAGE_NAME: incident-ops-functions.zip

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/functions/global.json

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults -p:CollectCoverage=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-results
          path: services/functions/TestResults

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet publish src/IncidentOps.Functions --configuration Release --output publish
          (cd publish && zip -qr "../${PACKAGE_NAME}" .)

      - name: Upload package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: functions-package
          path: services/functions/${{ env.PACKAGE_NAME }}
          if-no-files-found: error

  deploy:
    name: Deploy to Azure Functions
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-package

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.PACKAGE_NAME }}
          sku: flexconsumption
