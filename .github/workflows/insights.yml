name: insights

on:
  pull_request:
    paths:
      - services/insights/**
      - contracts/**
      - .github/workflows/insights.yml
      - .github/workflows/deploy-container-app.yml
  push:
    branches: [main]
    paths:
      - services/insights/**
      - .github/workflows/insights.yml
      - .github/workflows/deploy-container-app.yml

permissions:
  contents: read

concurrency:
  group: insights-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/insights

env:
  IMAGE_NAME: ghcr.io/marcelo-roman/incident-ops-insights

jobs:
  verify:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/insights/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: insights-coverage
          path: services/insights/coverage.xml

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/insights
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=insights
          cache-to: type=gha,mode=max,scope=insights

  deploy:
    name: Deploy to Azure Container Apps
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-container-app.yml
    with:
      container-app-name: ca-incident-ops-insights
      resource-group: rg-incident-ops
      image: ${{ needs.image.outputs.image }}
      health-url: https://incidents-insights.marceloroman.com.br/health
    secrets: inherit
