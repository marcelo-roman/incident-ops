name: api

on:
  pull_request:
    paths:
      - services/api/**
      - contracts/**
      - .github/workflows/api.yml
      - .github/workflows/deploy-container-app.yml
  push:
    branches: [main]
    paths:
      - services/api/**
      - .github/workflows/api.yml
      - .github/workflows/deploy-container-app.yml

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/api

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: ghcr.io/marcelo-roman/incident-ops-api
  COVERAGE_THRESHOLD: 80

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/api/global.json

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --settings coverage.runsettings
          --collect "XPlat Code Coverage"
          --results-directory TestResults
          --logger trx

      - name: Coverage report
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"Cobertura;TextSummary;MarkdownSummaryGithub"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        run: |
          line=$(grep -oP 'Line coverage: \K[0-9.]+' coverage/Summary.txt)
          echo "Line coverage ${line}% (threshold ${COVERAGE_THRESHOLD}%)"
          awk -v value="$line" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN { exit !(value >= threshold) }'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            services/api/TestResults/**/*.trx
            services/api/coverage/

  image:
    name: Build and push image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy to Azure Container Apps
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-container-app.yml
    with:
      container-app-name: ca-incident-ops-api
      resource-group: rg-incident-ops
      image: ghcr.io/marcelo-roman/incident-ops-api:${{ github.sha }}
      health-url: https://incidents-api.marceloroman.com.br/health/ready
    secrets: inherit
