name: incident-ops-api

x-sql-password: &sql-password ${MSSQL_SA_PASSWORD:-IncidentOps!Local1}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *sql-password
    ports:
      - "${SQL_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: *sql-password
    volumes:
      - ./deploy/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${SERVICEBUS_PORT:-5672}:5672"
      - "${SERVICEBUS_HEALTH_PORT:-5300}:5300"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build: .
    image: incident-ops-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IncidentOps: "Server=sqlserver,1433;Database=IncidentOps;User Id=sa;\
        Password=${MSSQL_SA_PASSWORD:-IncidentOps!Local1};TrustServerCertificate=true"
      Database__ApplyMigrations: "true"
      Database__Seed: "true"
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__TopicName: incident-events
      Security__EscalationApiKey: ${ESCALATION_API_KEY:-local-dev-key}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: https://incidents.marceloroman.com.br
      Sla__TimeScale: ${SLA_TIME_SCALE:-1}
      DemoTraffic__Enabled: ${DEMO_TRAFFIC_ENABLED:-false}
      Chaos__Enabled: "true"
      OTEL_SERVICE_NAME: incident-ops-api
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      servicebus:
        condition: service_started
