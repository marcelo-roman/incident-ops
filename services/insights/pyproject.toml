[project]
name = "incident-insights"
version = "0.1.0"
description = "KTLO analytics and AI-assisted root cause analysis drafts for Incident Ops."
readme = "README.md"
license = "MIT"
authors = [{ name = "Marcelo Roman" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.19",
    "azure-monitor-opentelemetry>=1.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2.0",
    "openai>=1.60",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "threadpoolctl>=3.5",
    "typer>=0.15",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
incident-insights = "incident_insights.interface.cli.app:app"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
notebook = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_insights"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RET",
    "PTH",
    "N",
    "C4",
    "PL",
    "RUF",
    "ERA",
    "T20",
    "DTZ",
    "A",
    "ARG",
    "ASYNC",
    "BLE",
    "FLY",
    "FURB",
    "G",
    "ICN",
    "ISC",
    "LOG",
    "PERF",
    "PGH",
    "PIE",
    "PT",
    "RSE",
    "S",
    "SLF",
    "TID",
    "YTT",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "DTZ001", "S101"]
"tests/builders.py" = ["PLR0913"]
"src/incident_insights/infrastructure/incidents/retry.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "threadpoolctl", "azure.monitor.opentelemetry.*", "opentelemetry.instrumentation.httpx.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "incident_insights"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interface -> infrastructure -> application -> domain"
type = "layers"
layers = [
    "incident_insights.interface",
    "incident_insights.infrastructure",
    "incident_insights.application",
    "incident_insights.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application do not depend on I/O frameworks"
type = "forbidden"
source_modules = ["incident_insights.domain", "incident_insights.application"]
forbidden_modules = [
    "azure",
    "fastapi",
    "httpx",
    "jinja2",
    "jwt",
    "openai",
    "opentelemetry",
    "pydantic_settings",
    "starlette",
    "typer",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Domain model is plain Python, without serialization frameworks"
type = "forbidden"
source_modules = ["incident_insights.domain"]
forbidden_modules = ["pydantic"]

[[tool.importlinter.contracts]]
name = "pandas and scikit-learn stay inside domain services"
type = "forbidden"
source_modules = [
    "incident_insights.domain.shared",
    "incident_insights.domain.incidents",
    "incident_insights.domain.kpis.report",
    "incident_insights.domain.recurring.cluster",
    "incident_insights.domain.anomalies.volume_anomaly",
    "incident_insights.domain.rca",
    "incident_insights.domain.reports.ktlo_report",
]
forbidden_modules = ["pandas", "sklearn", "scipy", "threadpoolctl"]

[[tool.importlinter.contracts]]
name = "HTTP routers depend on use cases, not adapters"
type = "forbidden"
source_modules = ["incident_insights.interface.api.routers"]
forbidden_modules = ["incident_insights.infrastructure"]

[[tool.importlinter.contracts]]
name = "Interface sees use-case outputs, not the domain model"
type = "forbidden"
source_modules = ["incident_insights.interface"]
forbidden_modules = [
    "incident_insights.domain.incidents",
    "incident_insights.domain.kpis",
    "incident_insights.domain.recurring",
    "incident_insights.domain.anomalies",
    "incident_insights.domain.rca",
    "incident_insights.domain.reports",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Analytics features are independent"
type = "independence"
modules = [
    "incident_insights.domain.kpis",
    "incident_insights.domain.recurring",
    "incident_insights.domain.anomalies",
    "incident_insights.domain.rca",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=incident_insights --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:incident_insights.*"]

[tool.coverage.run]
branch = true
source = ["incident_insights"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 85
